<body>

    <h1>Edit Book</h1>

    <form th:action="@{/editbook/{id}(id=${book.id})}" method="post">

        <label for="title">Title:</label>
        <input
                type="text"
                id="title"
                name="title"
                th:value="${book.title}"
                required
        >

        <label for="author">Author:</label>
        <input
                type="text"
                id="author"
                name="author"
                th:value="${book.author}"
                required
        >

        <label for="publicationYear">Publication Year:</label>
        <input
                type="number"
                id="publicationYear"
                name="publicationYear"
                th:value="${book.publicationYear}"
                required
        >

        <label for="isbn">ISBN:</label>
        <input
                type="text"
                id="isbn"
                name="isbn"
                th:value="${book.isbn}"
                required
        >

        <label for="price">Price:</label>
        <input
                type="number"
                id="price"
                name="price"
                th:value="${book.price}"
                step="0.01"
                required
        >

        <label for="bookTypeId">Book type:</label>
        <select id="bookTypeId" name="bookTypeId" required>
            <option th:each="bookType : ${bookTypes}"
                th:value="${bookType.booktypeid}"
                th:text="${bookType.myBookType}"
                th:selected="${book.bookType != null and book.bookType.booktypeid == bookType.booktypeid}"></option>
        </select>

        <button type="submit">Save Changes</button>

    </form>

</body>
