<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

<body>

    <h1>Books</h1>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Author</th>
                <th>Type</th>
                <th>Title</th>
                <th>ISBN</th>
                <th>Year</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>

            <!-- Loop through every Book in the repository -->
            <tr th:each="book : ${books}">

                <td th:text="${book.author}"></td>
                <td th:text="${book.bookType.myBookType}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.publicationYear}"></td>
                <td th:text="${book.price}"></td>
                <td><a class="btn btn-danger" th:href="@{/deletebook/{id}(id=${book.id})}">Delete</a></td>
                <td><a th:href="@{/editbook/{id}(id=${book.id})}">Edit</a></td>

            </tr>

        </tbody>

        

    </table>

    <a class="btn btn-success" href="/addbook">Add</a>

</body>
</html>
