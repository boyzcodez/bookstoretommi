<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Books</title>

    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 30px;
        }

        h1 {
            font-size: 48px;
        }

        table {
            border-collapse: collapse;
            font-size: 24px;
        }

        th, td {
            padding: 8px 16px;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Books</h1>

    <table>

        <thead>
            <tr>
                <th>Author</th>
                <th>Title</th>
                <th>ISBN</th>
                <th>Year</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>

            <!-- Loop through every Book in the repository -->
            <tr th:each="book : ${books}">

                <td th:text="${book.author}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.publicationYear}"></td>
                <td th:text="${book.price}"></td>

            </tr>

        </tbody>

    </table>

</body>
</html>
